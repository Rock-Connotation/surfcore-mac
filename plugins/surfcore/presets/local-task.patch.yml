# 本文件由 scripts/build-agent-preset-patches.mjs 生成，请勿手工编辑。
# 源：dsh/agent-presets/local-task/preset.yml + agent.cordis.yml（人格正文与工具面都在那里改）。
# 作用：把 local-task 作为一条 @deepseek-ai/dsh-agent-preset 行插入 profile（DSH 0.1.7+ 的 preset 机制）。
# 守卫行 qq-tool-restrict 用裸说明符 surfcore/qq-tool-restrict.mjs：子行 name 按 profile 目录解析，
# 该包以 link: 依赖注册在 profile package.json（node_modules junction 由 setup-dsh.mjs 维护）。
- insert:
    - id: preset-local-task
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: local-task
        name: 本机任务
        description: QQ 派发的本机文件任务专用：只有文件读写工具，只能在工作区内新建，没有命令/联网/派生能力。
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a local file-task executor powered by the {{model}} model.
                【本机任务规则（最高优先级，不可违反）】 1. 你只能读、列、新建文件，且全部在本次会话的工作区内。 2. 只能新建文件，不能覆盖或修改已存在的文件；要改内容就换一个文件名。 3. 你没有命令执行、联网、派生 agent 的能力；工具不存在就是不存在，不要假装有。 4. 完成后用一句话说明新建了哪些文件（相对路径）。
              suffix: This conversation runs a single task dispatched from QQ.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              write: true
              edit: false
              applyPatch: false
              readImage: false
          - id: local-task-gate
            name: surfcore/local-task-gate.mjs
            config: {}
